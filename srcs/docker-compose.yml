services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    restart: always
    env_file: [ .env ]
    secrets: [ db_password, db_root_password ]
    volumes:
      - mariadb_vol:/var/lib/mysql
    networks:
      - inception_net
    expose: [ "3306" ]

  redis:
    build: ./requirements/bonus/redis
    image: redis:inception
    container_name: redis
    restart: always
    networks:
      - inception_net
    expose: [ "6379" ]

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    restart: always
    env_file: [ .env ]
    secrets: [ db_password, wp_admin_password, wp_user_password ]
    depends_on: [ mariadb, redis ]
    volumes:
      - wordpress_vol:/var/www/html
    networks:
      - inception_net
    expose: [ "9000" ]

  adminer:
    build: ./requirements/bonus/adminer
    image: adminer:inception
    container_name: adminer
    restart: always
    depends_on: [ mariadb ]
    networks:
      - inception_net
    expose: [ "8080" ]

  static_site:
    build: ./requirements/bonus/static_site
    image: static_site:inception
    container_name: static_site
    restart: always
    networks:
      - inception_net
    expose: [ "3000" ]

  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    container_name: nginx
    restart: always
    env_file: [ .env ]
    depends_on: [ wordpress, adminer, static_site ]
    volumes:
      - wordpress_vol:/var/www/html:ro
    networks:
      - inception_net
    ports:
      - "443:443"

  cadvisor:
    build: ./requirements/bonus/cadvisor
    image: cadvisor:inception
    container_name: cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - inception_net
    ports:
      - "8080:8080"

  ftp:
    build: ./requirements/bonus/ftp
    image: ftp:inception
    container_name: ftp
    restart: always
    env_file: [ .env ]
    secrets: [ ftp_password ]
    depends_on: [ wordpress ]
    volumes:
      - wordpress_vol:/var/www/html
    networks:
      - inception_net
    ports:
      - "21:21"
      - "21100-21110:21100-21110"

volumes:
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nakhalil/data/mariadb
  wordpress_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nakhalil/data/wordpress

networks:
  inception_net:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt